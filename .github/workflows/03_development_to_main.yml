name: Development → Main

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to promote deploy files from"
        required: false
        default: "development"
      target_branch:
        description: "Target branch to push deploy files into"
        required: false
        default: "main"

concurrency:
  group: deploy-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write  # needed to trigger sync_to_hub.yml via `gh workflow run` below

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


# ============ Promote deployable app files ============ #

jobs:
  sync-deploy-files:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || vars.SOURCE_BRANCH || 'development' }}
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || vars.TARGET_BRANCH || 'main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_BRANCH }}
          path: source

      - name: Validate deploy files
        run: |
          set -euo pipefail
          cd source
          required_files=(
            "app.py"
            "data/scb_months_lvl1.parquet"
            "Dockerfile"
            ".dockerignore"
            "pyproject.toml"
            "uv.lock"
            ".python-version"
            "src/__init__.py"
            "src/constants.py"
            "src/data.py"
            "src/utils.py"
            "src/calcs.py"
            "src/visuals.py"
            "md_files/intro.md"
            "md_files/about.md"
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required deploy file: $file"
              exit 1
            fi
          done

      - name: Create deploy bundle
        run: |
          set -euo pipefail
          cd source
          files=(
            "app.py"
            "data/scb_months_lvl1.parquet"
            "Dockerfile"
            ".dockerignore"
            "pyproject.toml"
            "uv.lock"
            ".python-version"
            "src/__init__.py"
            "src/constants.py"
            "src/data.py"
            "src/utils.py"
            "src/calcs.py"
            "src/visuals.py"
            "md_files/intro.md"
            "md_files/about.md"
            "README.md"
          )

          tar -czf ../deploy-files.tgz "${files[@]}"

      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: source/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Gate: a failure here stops the job before anything is committed to
      # main, so a bad dataset is never deployed to the Space.
      - name: Validate the dataset before promoting it
        run: |
          set -euo pipefail
          previous_args=()
          if [ -f target/data/scb_months_lvl1.parquet ]; then
            previous_args=(--previous target/data/scb_months_lvl1.parquet)
          fi
          uv run --no-project --with polars python source/scripts/validate.py \
            source/data/scb_months_lvl1.parquet "${previous_args[@]}"

      - name: Apply deploy bundle
        run: |
          set -euo pipefail
          tar -xzf deploy-files.tgz -C target

      - name: Commit and push
        id: promote
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            app.py \
            data/scb_months_lvl1.parquet \
            Dockerfile \
            .dockerignore \
            pyproject.toml \
            uv.lock \
            .python-version \
            src/__init__.py \
            src/constants.py \
            src/data.py \
            src/utils.py \
            src/calcs.py \
            src/visuals.py \
            md_files/intro.md \
            md_files/about.md \
            README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: promote deployable app files [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "${TARGET_BRANCH}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); rebasing onto latest ${TARGET_BRANCH} and retrying..."
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 5))
          done

          echo "ERROR: failed to push to ${TARGET_BRANCH} after 5 attempts."
          exit 1

      # A push made with the workflow token does not trigger other workflows,
      # and sync_to_hub.yml only runs weekly on its own, so start it here when
      # main actually changed.
      - name: Redeploy the Hugging Face Space
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync_to_hub.yml --repo "${GITHUB_REPOSITORY}" --ref main
